<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-teal-100">
  <h1 class="text-3xl font-bold text-amber-900 text-center mt-10">
    Rock Paper Scissors
  </h1>
  <div class="flex items-center justify-center gap-10">
    <button class="w-50 h-50 bg-amber-100 mt-20 choice" id="rockbtn">ROCK</button>
    <button class="w-50 h-50 bg-amber-100 mt-20 choice" id="paperbtn">PAPER</button>
    <button class="w-50 h-50 bg-amber-100 mt-20 choice" id="scibtn">SCISSORS</button>
  </div>
  <h2 class="bg-teal-50 w-30 text-xl font-bold mx-auto mt-10">YOUR TURN</h2>
  <div class="text-center mt-10 hidden">Winner/Looser</div>
  <button class="block mx-auto mt-10 hidden">NEW GAME</button>
  <script src="script.js"></script>
</body>
</html>
